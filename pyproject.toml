[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwenjev-lite"
version = "0.1.0"
description = "A Jev-style decision model (shared state, isolated branches, parallel probability readouts) on a Qwen3.5-4B backbone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=5.0",
    "accelerate",
    "numpy",
    "fastapi",
    "uvicorn",
    "pydantic>=2",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.scripts]
qwenjev = "qwenjev.cli:main"

[tool.setuptools.packages.find]
include = ["qwenjev*"]
